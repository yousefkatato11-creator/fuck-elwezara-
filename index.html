<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftAssess Login Clone</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts for accurate styling -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Segoe+UI&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Right Side Tab -->
    <div class="side-tab">
        البديل الثاني
    </div>

    <!-- Main Content Centered -->
    <div class="main-content">
        
        <!-- Ministry of Education Logo -->
        <div class="moe-logo-container">
            <img src="images/moe_logo_real.png" alt="وزارة التربية والتعليم والتعليم الفني" class="moe-logo">
        </div>

        <!-- Login Form -->
        <div class="login-form">
            <input type="text" class="login-input" value="b3b2a9b6e52" readonly>
            <button class="login-btn">تسجيل الدخول</button>
        </div>

        <!-- SwiftAssess Logo -->
        <div class="sa-logo-container">
            <img src="images/sa_logo_real.png" alt="SwiftAssess" class="sa-logo-img">
        </div>

    </div>

    <!-- Bottom Footer -->
    <footer class="footer">
        <div class="footer-text">
            من SwiftAssess © جماليين - v1.9.15
        </div>
        <div class="footer-lang">
            English
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
